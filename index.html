<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f8">
  <title>便利Webツール</title>
  <meta name="description" content="文章の整形など、日常の作業を少し便利にするシンプルなWebツール集。">
  <link rel="stylesheet" href="text_formatter/style.css">
</head>
<body>
  <main class="home-shell">
    <header class="home-header">
      <span class="eyebrow">毎日の作業を、ちょっと便利に</span>
      <h1>便利Webツール</h1>
      <p class="lead">むずかしい設定は不要。使いたいツールを選んで、すぐに始められます。</p>
    </header>
    <section aria-labelledby="available-title">
      <h2 id="available-title">現在利用できるツール</h2>
      <div class="tool-grid">
        <!-- ツールを追加するときは、この a.tool-card を複製してリンクと説明を変更します。 -->
        <a class="tool-card" href="text_formatter/index.html">
          <span class="tool-icon" aria-hidden="true">Aa</span>
          <span class="tag">テキスト</span>
          <h3>文章整形ツール</h3>
          <p>余分な空白や改行を整理して、コピーした文章を読みやすく整えます。</p>
          <span class="card-action">ツールを開く <span aria-hidden="true">→</span></span>
        </a>
      </div>
    </section>
    <aside class="coming-soon">
      <h2>これから、少しずつ追加予定</h2>
      <p>QRコード作成・パスワード生成・ファイル名生成・画像リサイズなど、日常で役立つツールを追加していく予定です。</p>
    </aside>
    <footer>登録不要・無料で利用できます</footer>
  </main>
</body>
</html>
