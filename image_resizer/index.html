<!doctype html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4RX7JMCQLZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4RX7JMCQLZ');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8fa">
  <meta name="description" content="画像をブラウザ内でリサイズ・圧縮して保存できる無料ツール。">
  <title>かんたん画像リサイズ・圧縮</title>
  <link rel="stylesheet" href="style.css?v=87fd61b5a87e"><link rel="stylesheet" href="../theme.css?v=1"><script src="../theme.js?v=1"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="intro">
      <h1>かんたん画像リサイズ・圧縮</h1>
      <p>画像のサイズや容量をかんたんに小さくできます。画像は外部に送信されず、ブラウザ内で処理されます。</p>
    </header>

    <section class="card" aria-labelledby="choose-title">
      <h2 id="choose-title"><span class="step">1</span>画像を選ぶ</h2>
      <div class="drop-zone" id="drop-zone">
        <p class="drop-main">ここに画像をドラッグ＆ドロップ</p>
        <p class="drop-sub">または</p>
        <label class="button button-secondary" for="file-input">画像を選択</label>
        <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" aria-label="画像を選択">
        <p class="hint">JPG・PNG・WebPに対応</p>
      </div>
      <p class="message error" id="error" role="alert" hidden></p>
      <div class="image-info" id="original-section" hidden>
        <div class="preview"><img id="original-preview" alt="選択した元画像のプレビュー"></div>
        <dl class="details">
          <div><dt>ファイル名</dt><dd id="original-name"></dd></div>
          <div><dt>画像サイズ</dt><dd id="original-dimensions"></dd></div>
          <div><dt>ファイル容量</dt><dd id="original-size"></dd></div>
        </dl>
      </div>
    </section>

    <section class="card" aria-labelledby="size-title">
      <h2 id="size-title"><span class="step">2</span>横幅を指定する</h2>
      <p class="hint">縦幅は自動で調整されます。元画像より大きくはしません。</p>
      <div class="presets" role="group" aria-label="横幅の候補">
        <button type="button" class="preset" data-width="1280">1280px</button>
        <button type="button" class="preset" data-width="1000">1000px</button>
        <button type="button" class="preset" data-width="800">800px</button>
        <button type="button" class="preset" data-width="640">640px</button>
      </div>
      <label class="field-label" for="width-input">横幅を自由に入力</label>
      <div class="number-field"><input id="width-input" type="number" inputmode="numeric" min="1" max="16384" step="1" value="1280"><span>px</span></div>
      <p class="hint" id="width-note" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="quality-title">
      <h2 id="quality-title"><span class="step">3</span>画質と保存形式を選ぶ</h2>
      <div class="settings">
        <div>
          <label class="field-label" for="quality-input">画質 <strong id="quality-value">80%</strong></label>
          <input id="quality-input" type="range" min="50" max="100" value="80">
          <p class="hint" id="quality-note">数字を下げると容量が小さくなりやすくなります。</p>
        </div>
        <div>
          <label class="field-label" for="format-input">保存形式</label>
          <select id="format-input">
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card action-card" aria-labelledby="convert-title">
      <h2 id="convert-title"><span class="step">4</span>変換する</h2>
      <button type="button" class="button button-primary" id="convert-button" disabled>画像を変換する</button>
      <p class="message" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card result-card" id="result-section" aria-labelledby="save-title" hidden>
      <h2 id="save-title"><span class="step">5</span>確認して保存する</h2>
      <div class="image-info">
        <div class="preview"><img id="result-preview" alt="変換後の画像のプレビュー"></div>
        <div>
          <dl class="details">
            <div><dt>画像サイズ</dt><dd id="result-dimensions"></dd></div>
            <div><dt>ファイル容量</dt><dd id="result-size"></dd></div>
            <div><dt>容量の比較</dt><dd id="size-comparison"></dd></div>
          </dl>
          <p class="saving" id="saving"></p>
        </div>
      </div>
      <button type="button" class="button button-primary" id="save-button">保存する</button>
    </section>

    <button type="button" class="button button-quiet reset" id="reset-button">リセット</button>
  </main>
</body>
</html>
